# ===============================
# PERFIL DE HOMOLOGAÇÃO
# ===============================

server:
  port: 8081
  servlet:
    context-path: /api
  forward-headers-strategy: framework

spring:
  application:
    name: laudos-homolog

  web:
    resources:
      static-locations: file:/opt/sistema/laudos/angular17/

  datasource:
    url: jdbc:postgresql://129.121.37.75:5432/db_laudos
    username: sistema_user
    password: skxiev6z   #${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

# ===============================
# LOGGING
# ===============================

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  file:
    name: /opt/sistema/laudos/java17/logs/laudos-homolog.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

# ===============================
# ACTUATOR (opcional)
# ===============================

management:
  endpoints:
    web:
      exposure:
        include: health,info
