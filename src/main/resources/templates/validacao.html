<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Validação de Laudo</title>

    <style>
        body {font-family: Arial, sans-serif; background: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh;}
        .card {background: white; padding: 30px; border-radius: 10px; width: 400px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center;}
        .status {font-size: 20px; color: green; font-weight: bold; margin-bottom: 20px;}
        .info {text-align: left; font-size: 14px; margin-top: 15px;}
        .info p {margin: 6px 0;}
        .titulo {font-size: 18px; margin-bottom: 10px; color: #6f7895;font-weight: bold;}
    </style>
</head>
<body>

<div class="card">

    <div class="titulo">Validação de Laudo</div>

    <div class="status" th:text="${status}">VÁLIDO</div>

    <div class="info">
        <p><strong>Paciente:</strong> <span th:text="${paciente}"></span></p>
        <p><strong>Data:</strong> <span th:text="${#temporals.format(data, 'dd/MM/yyyy')}"></span></p>
        <p><strong>Médico:</strong> <span th:text="${medico}"></span></p>
        <p><strong>CRM:</strong> <span th:text="${crm}"></span></p>
    </div>

</div>

</body>
</html>
